services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - redis_data:/data

  collector:
    build: .
    restart: unless-stopped
    command: python -m collector.runner

    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      RQ_QUEUE: article_processing

      FEEDS_CONFIG_PATH: /config/feeds.toml
      COLLECTOR_TICK_SECONDS: "60"

    depends_on:
      redis:
        condition: service_healthy

    volumes:
    - ./config:/config:ro

  worker:
    build: .
    restart: unless-stopped

    command:
      - sh
      - -c
      - |
        set -e
        python -c "from database import setup_database; setup_database()"
        exec python -m workers.worker_runner

    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      RQ_QUEUE: article_processing
      DB_PATH: /data/chronicle.db
      ENTITY_RULES_PATH: /config/entity_rules.toml
      CLUSTERING_CONFIG_PATH: /config/clustering.toml

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - sqlite_data:/data
      - ./config:/config:ro

  api:
    build: .
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080

    environment:
      DB_PATH: /data/chronicle.db
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      RQ_QUEUE: article_processing

    ports:
      - "8080:8080"

    volumes:
      - sqlite_data:/data

    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  redis_data:
  sqlite_data:
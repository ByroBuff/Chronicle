[[rules]]
id = "email-address"
enabled = true
entity_type = "EMAIL"
pattern = '(?P<value>[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})'
group = "value"
flags = ["IGNORECASE"]
normalizers = ["strip", "lower"]
max_matches = 100

[[rules]]
id = "cve-id"
enabled = true
entity_type = "CVE"
pattern = '\b(?P<value>CVE-\d{4}-\d{4,})\b'
group = "value"
flags = ["IGNORECASE"]
normalizers = ["strip", "upper"]
max_matches = 100

[[rules]]
id = "ipv4-address"
enabled = true
entity_type = "IP_ADDRESS"
pattern = '\b(?P<value>(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3})\b'
group = "value"
normalizers = ["strip"]
max_matches = 100

[[rules]]
id = "sha256-hash"
enabled = true
entity_type = "SHA256"
pattern = '\b(?P<value>[A-Fa-f0-9]{64})\b'
group = "value"
normalizers = ["strip", "lower"]
max_matches = 100

[[rules]]
id = "breach-record-count"
enabled = true
entity_type = "RECORD_COUNT"
pattern = '(?P<count>\d[\d,]*)\s+(?:records?|accounts?|users?)'
value_template = '{count}'
flags = ["IGNORECASE"]
normalizers = ["strip"]
max_matches = 20